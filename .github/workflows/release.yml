name: Release

# Push a version tag to publish a release:
#   git tag v0.1.0
#   git push origin v0.1.0
# The zip holds the source plus the built web UI, so users do not need Node.js.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          echo "${GITHUB_REF_NAME}" > dist/.release

      - name: Package
        run: |
          name="visionloop-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="${name}/" HEAD | tar -x
          cp -r frontend/dist "${name}/frontend/dist"
          # every file the release ships: an update removes only files listed by the previous release
          (cd "${name}" && { find . -type f | sed 's|^\./||'; echo release_manifest.txt; } | sort -u > release_manifest.txt)
          zip -qr "${name}.zip" "${name}"
          # the app checks the download against this before installing it
          sha256sum "${name}.zip" | cut -d' ' -f1 > "${name}.zip.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "visionloop-${GITHUB_REF_NAME}.zip" "visionloop-${GITHUB_REF_NAME}.zip.sha256" --title "${GITHUB_REF_NAME}" --generate-notes
